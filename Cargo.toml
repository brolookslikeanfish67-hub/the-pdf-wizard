[package]
name = "the-pdf-wizard"
version = "0.1.0"
edition = "2026"
authors = ["ryen stuff yt"]
description = "A high-performance Rust library and CLI tool for parsing, editing, and manipulating PDF files."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = "0.31.0"
rayon = "1.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
wasm-bindgen = "0.2"

[[bin]]
name = "pdf-wizard"
path = "src/main.rs"
