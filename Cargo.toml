[package]
name = "the-pdf-wizard"
version = "0.1.0"
edition = "2024"
authors = ["brolookslikeanfish67-hub"]
description = "A high-performance Rust library and CLI tool for parsing, editing, and manipulating PDF files."
repository = "https://github.com/brolookslikeanfish67-hub/the-pdf-wizard"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = "0.31.0"
rayon = "1.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
wasm-bindgen = "0.2"

[[bin]]
name = "pdf-wizard"
path = "src/main.rs"
